# Compila el APK en GitHub, sin instalar nada en tu computadora.
# Cada vez que subís cambios a "main" se genera un Release con arac-partidos.apk
# (pestaña "Releases" del repositorio), listo para bajar desde el celular.

name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Copiar la app al proyecto Android
        run: npx cap sync android

      - name: Compilar
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../arac-partidos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: arac-partidos-apk
          path: arac-partidos.apk
          if-no-files-found: error

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ARAC Partidos (compilación ${{ github.run_number }})
          body: Instalá arac-partidos.apk desde el celular.
          files: arac-partidos.apk
          make_latest: true
