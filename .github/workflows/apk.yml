# Compila el APK en GitHub, sin instalar nada en tu computadora.
# Cada vez que subís cambios a "main" se genera un Release con arac-partidos.apk
# (pestaña "Releases" del repositorio), listo para bajar desde el celular.

name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # El runner ya trae el Android SDK; solo aseguramos la plataforma 35.
      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Copiar la app al proyecto Android
        run: npx cap sync android

      # Clave de firma fija (secretos del repositorio). Sin ella cada APK saldría con otra clave
      # y no se podría instalar encima del anterior, así que la compilación se detiene.
      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arac.keystore"
          echo "ARAC_KEYSTORE=$RUNNER_TEMP/arac.keystore" >> "$GITHUB_ENV"
          echo "ARAC_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Compilar
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../arac-partidos.apk

      - uses: actions/upload-artifact@v5
        with:
          name: arac-partidos-apk
          path: arac-partidos.apk
          if-no-files-found: error

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ARAC Partidos (compilación ${{ github.run_number }})
          body: Instalá arac-partidos.apk desde el celular.
          files: arac-partidos.apk
          make_latest: true
